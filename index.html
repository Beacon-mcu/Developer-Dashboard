<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create Beacon apps, get your Client ID and read the docs." />
    <meta name="google-site-verification" content="SpzoflN4yV636mkSn8ZQUuFRCJg6mJS28jgUzgmKS48" />
    <title>Beacon Dashboard</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so the page never flashes the wrong one.
      try {
        var saved = localStorage.getItem("beacon:theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
