name = "dashboard"
compatibility_date = "2024-11-01"

# The built site (dist/), served as a single-page app: every unknown path serves index.html.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain (dash.beaconmcu.space): add it in the Cloudflare dashboard (Worker -> Domains)
# once the beaconmcu.space nameservers are on Cloudflare. Not set here so deploys never depend on DNS.
